{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}AulaRural{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
  {% if user.is_authenticated %}
  <header class="barra">
    <a class="marca" href="{% url 'panel' %}">AulaRural</a>
    <nav class="menu">
      <a href="{% url 'panel' %}">Inicio</a>
      <a href="#">Grupos</a>
      <a href="#">Planeaciones</a>
      <a href="#">Asistencia</a>
      <a href="#">Informes</a>
    </nav>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="boton boton-claro" type="submit">Salir</button>
    </form>
  </header>
  {% endif %}

  <main class="contenedor">
    {% if messages %}
      {% for mensaje in messages %}
        <div class="mensaje mensaje-{{ mensaje.tags }}">{{ mensaje }}</div>
      {% endfor %}
    {% endif %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
